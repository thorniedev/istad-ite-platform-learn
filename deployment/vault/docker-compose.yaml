services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-server
    restart: unless-stopped
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - ./logs:/vault/logs:rw
      - ./data:/vault/data:rw
      - ./config/config.hcl:/vault/config/config.hcl:ro
    cap_add:
      - IPC_LOCK