services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - ./certs:/vault/certs:ro
      - ./data:/vault/data
      - ./logs:/vault/logs
    command: server