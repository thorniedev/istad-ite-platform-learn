server:
  port: 3000

spring:
  application:
    name: order-service

  http:
    serviceclient:
      customer-service:
        # If running with Consul: http://customer-service
        # If running directly without Consul: http://localhost:9091
        base-url: http://customer-service

  security:
    oauth2:
      client:
        registration:
          order-client:
            client-id: order-service-client
            client-secret: orderSecret123
            authorization-grant-type: client_credentials
            scope:
              - customer.read
              - customer.write
        provider:
          order-client:
            token-uri: http://localhost:9000/oauth2/token

  config:
    import: "optional:consul:"

  profiles:
    active: dev

  cloud:
    consul:
      host: 127.0.0.1
      port: 8500
      discovery:
        service-name: order-service
        instance-id: ${spring.application.name}:${server.port}
        ip-address: 127.0.0.1
        prefer-ip-address: true
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        health-check-interval: 10s
        health-check-critical-timeout: 1m
        deregister: true

      config:
        enabled: true
        format: yaml
        watch:
          enabled: false
          delay: 5000
          wait-time: 15

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/order_db
    username: iteuser
    password: qwerqwer

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

grpc:
  client:
    product-service:
      address: 'static://localhost:9095'
      negotiation-type: plaintext

