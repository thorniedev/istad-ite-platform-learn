#server:
#  port: 9092

spring:
  application:
    name: order-service
  config:
    import: "optional:consul:"
  profiles:
    active: dev

  cloud:
    consul:
      host: 127.0.0.1
      port: 8500
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        ip-address: 127.0.0.1
        prefer-ip-address: true
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
          delay: 5000
          wait-time: 15

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/order_db
    username: iteuser
    password: qwerqwer

  liquibase:
    enabled: true
    drop-first: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/order_db
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver