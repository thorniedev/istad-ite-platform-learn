plugins {
    id 'spring-common-conventions'
    id 'spring-cloud-common-conventions'
    // alias(libs.plugins.protobuf)
}
repositories {
    mavenCentral()
    maven {
        name = 'buf'
        url 'https://buf.build/gen/maven'
    }
}

dependencies {

    // gRPC Client Starter
    implementation libs.grpc.client.spring.boot.starter

    // Force Protobuf Runtime to match Buf's 4.36.2 gencode:
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    // Buf BSR Data Models & gRPC Stubs:
    // Protobuf Data Models (សារ Messages & Builders)
    implementation('build.buf.gen:chanthorndev-buf_istad-platform_protocolbuffers_java:36.2.0.1.20261105173439.7b9a55c953bf')

    // gRPC Service Stubs (Server Base Class & Client Stubs)
    implementation('build.buf.gen:chanthorndev-buf_istad-platform_grpc_java:1.85.1.1.20261105173439.7b9a55c953bf')


    implementation "kh.edu.istad:order-application-service"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation libs.spring.boot.starter.webflux
    implementation libs.reactor.core
    // implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'com.github.ben-manes.caffeine:caffeine'

}