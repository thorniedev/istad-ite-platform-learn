syntax = "proto3";

package kh.edu.istad.product.grpc;

// Java Options (ការកំណត់សម្រាប់ការ Generate កូដ Java)
option java_multiple_files = true;
option java_package = "kh.edu.istad.product.grpc";
option java_outer_classname = "ProductProto";

// Service Definition (RPC Methods)
service ProductGrpcService {
  rpc GetProductById (ProductRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
}

// Messages Definition (Data Payloads)
message ProductRequest {
  string product_id = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 quantity = 3;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
}

// ./gradlew :microservices:order-service:order-service-client:generateProto