server:
  port: 2222  # HTTP MVC port

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:9543/product_db
    username: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

grpc:
  server:
    port: 3333          # Dedicated gRPC Netty port
    reflection-service-enabled: true
  client:
    product-service:
      address: 'static://localhost:3333'
      negotiation-type: plaintext


