syntax = "proto3";

package kh.edu.istad.product.grpc;

option java_multiple_files = true;
option java_package = "kh.edu.istad.product.grpc";
option java_outer_classname = "ProductProto"; // ឈ្មោះ Class កណ្តាលដែលផ្ទុកនូវ Metadata និង Schema Definitions នៃ Proto ទាំងមូល។

service ProductGrpcService {
  // Unary: one response containing the entire product list.
  rpc GetAllProducts (ListProductsRequest) returns (ProductListResponse);
  rpc GetProductById (ProductRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  // One request, followed by zero or more product responses.
  //stream នៅខាងមុខ ProductResponse ប្រាប់ gRPC ថា Server អាចបញ្ជូន Response Messages ច្រើនសម្រាប់ Request តែមួយ។
  rpc ListProducts (ListProductsRequest) returns (stream ProductResponse);
}

message ListProductsRequest {}

message ProductListResponse {
  repeated ProductResponse products = 1;
}

message ProductRequest {
  string product_id = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 quantity = 3;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
}