plugins {
    id 'spring-boot-common-conventions'
}

repositories {
        mavenCentral()
        maven {
            name = 'buf'
            url 'https://buf.build/gen/maven'
        }
}

dependencies {

    implementation libs.spring.boot.starter.webmvc

    // gRPC Spring Boot Starters & Reflection
    implementation libs.grpc.server.spring.boot.starter
    implementation libs.grpc.client.spring.boot.starter
    implementation libs.grpc.services

    // Force Protobuf Runtime to match Buf's 4.36.2 gencode:
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    // Protobuf Data Models ( Messages & Builders)
    implementation('build.buf.gen:chanthorndev-buf_istad-platform_protocolbuffers_java:36.2.0.1.20261105173439.7b9a55c953bf')

    // gRPC Service Stubs (Server Base Class & Client Stubs)
    implementation('build.buf.gen:chanthorndev-buf_istad-platform_grpc_java:1.85.1.1.20261105173439.7b9a55c953bf')

    // spring data
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    testImplementation libs.spring.boot.starter.test.webmvc
    testImplementation libs.grpc.testing
}
