server:
  port: 9999

spring:
  application:
    name: gateway
  profiles:
    default:

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
#          default-filters:
#            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - RewritePath=/api/orders/?(?<segment>.*), /${segment}
                - SaveSession

            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /${segment}
            - id: nextjs
              uri: http://localhost:3001
              predicates:
                - Path=/**
#              filters:
#                - RewritePath=/jph/?(?<segment>.*), /${segment}

    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        ip-address: 127.0.0.1
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        service-name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: "health, gateway, info"
  endpoint:
    gateway:
      access: read_only
