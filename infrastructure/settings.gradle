pluginManagement {
    includeBuild('../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs{
            from(files("../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'infrastructure'

include 'config-server'
include 'oauth2-server'
include 'gateway'
